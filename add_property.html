<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/add_property.css">
</head>
<body>
    <div id="propertyModal" class="modal">
    <div class="modal-content">
    <div class="modal-header">
      <h3>Add New Property</h3>
      <span class="close-modal">&times;</span>
    </div>
    <form id="addPropertyForm">
      <div class="form-group">
        <label>Property Name</label>
        <input type="text" id="propName" placeholder="e.g. Stretford" required>
      </div>
      <div class="form-group">
        <label>Location</label>
        <input type="text" id="propLocation" placeholder="e.g. Mabs or Stage" required>
      </div>
      <div class="form-group">
        <label>Price (Ksh/Month)</label>
        <input type="number" id="propPrice" placeholder="12000" required>
      </div>
      <div class="form-group">
        <label>Property Image URL</label>
        <input type="text" id="propImage" placeholder="link to image">
      </div>
      <button type="submit" class="btn-primary">Save Property</button>
    </form>
  </div>
</div>
<script>
  const modal = document.getElementById("propertyModal");
  const closeBtn = document.querySelector(".close-modal");


  // Close when clicking the X
  closeBtn.addEventListener("click", function () {
    window.location.href = "dashboards/landlord/index.html";
  });

  // Optional: Close when clicking outside modal content
  window.addEventListener("click", function (event) {
    if (event.target === modal) {
      window.location.href = "dashboards/landlord/index.html";
    }
  });
  // Attach saveProperty to form submit
  const addPropertyForm = document.getElementById("addPropertyForm");
  if (addPropertyForm) {
    addPropertyForm.addEventListener("submit", function(event) {
      if (typeof saveProperty === 'function') {
        saveProperty(event);
      }
    });
  }
</script>
<script src="js/propertyManager.js"></script>

</body>
</html>
